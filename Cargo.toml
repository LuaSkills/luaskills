[package]
name = "luaskills"
version = "0.5.9"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "LuaSkills core runtime library for loading, invoking, and managing Lua skill packages."
repository = "https://github.com/LuaSkills/luaskills"
homepage = "https://github.com/LuaSkills/luaskills"
documentation = "https://docs.rs/luaskills"
readme = "README.md"
keywords = ["lua", "skills", "runtime", "ffi", "luajit"]
categories = ["api-bindings", "development-tools::ffi"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/THIRD_PARTY_NOTICES.md",
    "/README.md",
    "/deny.toml",
    "/include/**",
    "/contracts/**",
    "/src/**",
    "/skills/**",
]

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
base64 = "0.22"
encoding_rs = "0.8"
flate2 = "1"
# Use operating-system randomness for fresh runtime namespaces without clock or PID reuse.
# 使用操作系统随机源生成新运行时命名空间，避免时钟或进程号复用。
getrandom = "=0.3.4"
libc = "0.2"
# Match the consuming host's schema engine and disable ambient network/file retrieval.
# 对齐消费宿主的 Schema 引擎，并禁用环境网络及文件检索。
jsonschema = { version = "=0.49.9", default-features = false }
libloading = "0.8"
mlua = { version = "0.12.0-rc.1", features = ["luajit52", "vendored", "serialize", "send"] }
notify = "8.2.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tar = "0.4.46"
tokio = { version = "1", features = ["rt-multi-thread"] }
vldb-controller-client = "0.2.3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
