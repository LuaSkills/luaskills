[package]
name = "luaskills"
version = "0.5.9"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "LuaSkills core runtime library for loading, invoking, and managing Lua skill packages."
repository = "https://github.com/LuaSkills/luaskills"
homepage = "https://github.com/LuaSkills/luaskills"
documentation = "https://docs.rs/luaskills"
readme = "README.md"
keywords = ["lua", "skills", "runtime", "ffi", "luajit"]
categories = ["api-bindings", "development-tools::ffi"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/build.rs",
    "/build_support/**",
    "/LICENSE",
    "/THIRD_PARTY_NOTICES.md",
    "/README.md",
    "/deny.toml",
    "/include/**",
    "/contracts/**",
    "/src/**",
    "/skills/**",
    # Library tests include these fixture bytes during compilation of any test selection.
    # 库测试在编译任何测试选择时都会嵌入这些夹具字节。
    "/tests/fixtures/managed_sessions/python/*.py",
    "/tests/fixtures/managed_sessions/node/*.mjs",
]

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
# Generate offline embedded contracts from the exact Rust serialization types only when requested.
# 仅在显式请求时，从精确 Rust 序列化类型生成离线嵌入式契约。
contract-generation = ["dep:schemars"]

[[bin]]
name = "generate_embedded_contract"
path = "src/bin/generate_embedded_contract.rs"
required-features = ["contract-generation"]

[dependencies]
base64 = "0.22"
encoding_rs = "0.8"
flate2 = "1"
# Use operating-system randomness for fresh runtime namespaces without clock or PID reuse.
# 使用操作系统随机源生成新运行时命名空间，避免时钟或进程号复用。
getrandom = "=0.3.4"
libc = "0.2"
# Match the consuming host's schema engine and disable ambient network/file retrieval.
# 对齐消费宿主的 Schema 引擎，并禁用环境网络及文件检索。
jsonschema = { version = "=0.49.9", default-features = false }
libloading = "0.8"
mlua = { version = "0.12.0-rc.1", features = ["luajit52", "vendored", "serialize", "send"] }
notify = "8.2.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# Match the host's SQLite binding and bundle the engine for portable durable operation journals.
# 对齐宿主的 SQLite 绑定并捆绑引擎，用于可移植的持久操作日志。
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "limits"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pin the offline schema generator so regenerated SDK contracts remain reproducible.
# 固定离线 Schema 生成器，使重新生成的 SDK 契约保持可复现。
schemars = { version = "=1.2.2", optional = true }
serde_yaml = "0.9"
sha2 = "0.10"
tar = "0.4.46"
tokio = { version = "1", features = ["rt-multi-thread"] }
vldb-controller-client = "0.2.3"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Reuse the existing hashing and JSON crates for deterministic local build metadata.
# 复用已有摘要及 JSON 库生成确定性的本地构建元数据。
[build-dependencies]
sha2 = "0.10"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
