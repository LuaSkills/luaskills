name: Build Verified Core Candidates

# Candidates remain workflow artifacts unless an independent aggregate draft step is explicitly requested.
# 候选默认保留为工作流产物，只有显式请求时才执行独立汇总草稿步骤。
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Full source commit SHA (must equal the workflow dispatch commit)"
        required: true
        type: string
      version:
        description: "Exact Cargo package version, without v prefix"
        required: true
        type: string
      mode:
        description: "Candidate artifacts only, or create a new immutable GitHub draft after all gates"
        required: true
        default: candidate
        type: choice
        options: [candidate, draft]

permissions:
  contents: read

concurrency:
  group: core-candidate-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      version: ${{ steps.identity.outputs.version }}
      source_archive: ${{ steps.identity.outputs.source_archive }}
    steps:
      - name: Preserve exact tracked source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.6"
      - name: Freeze full commit and current package version
        id: identity
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CORE_VERSION: ${{ inputs.version }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts/release")
          from candidate import source_identity, write_new
          # Commit includes the workflow definition and every candidate script as one frozen source.
          # 提交将工作流定义及每个候选脚本纳入同一冻结源码。
          if os.environ["SOURCE_SHA"] != os.environ["DISPATCH_SHA"]:
              raise SystemExit("Source SHA must equal the workflow dispatch commit")
          # Compress the authoritative Git tar once; every platform must preserve these exact frozen bytes.
          # 权威 Git tar 只压缩一次；每个平台必须保留这些精确冻结字节。
          source_archive_name = f"luaskills-source-{os.environ['CORE_VERSION']}-{os.environ['SOURCE_SHA']}.tar.gz"
          write_new(Path("target/frozen-source") / source_archive_name, source_identity(Path.cwd(), os.environ["SOURCE_SHA"], os.environ["CORE_VERSION"]))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"source_sha={os.environ['SOURCE_SHA']}\nversion={os.environ['CORE_VERSION']}\nsource_archive={source_archive_name}\n")
          PY
      # Offline regressions use the verified source checkout before any candidate build or draft operation.
      # 离线回归在任何候选构建或草稿操作前使用已核验的源码检出。
      - name: Verify release helper offline regressions
        shell: bash
        run: |
          python -X utf8 -m unittest discover -s scripts/release -p test_candidate.py -v
          python -X utf8 -m unittest discover -s scripts/release -p test_sdk_prerequisites.py -v
          python -X utf8 -m unittest discover -s scripts/release -p test_sdk_recovery.py -v
      # Exercise the real public source endpoint before native builds, packaging or draft creation.
      # 在原生构建、打包或草稿创建前验证真实公共源码端点。
      - name: Verify exact public commit archive before native builds
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_ARCHIVE: ${{ steps.identity.outputs.source_archive }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts/release")
          from candidate import encode, write_new
          from sdk_prerequisites import Http, verify_commit_source
          # The freeze step owns the exact source archive; the original verifier compares every ZIP member.
          # 冻结步骤拥有精确源码归档；原校验器比较每个 ZIP 成员。
          proof_root = Path("target/source-http-proof")
          proof = verify_commit_source(Http(), proof_root, os.environ["SOURCE_SHA"], Path("target/frozen-source") / os.environ["SOURCE_ARCHIVE"])
          write_new(proof_root / "source-http-proof.json", encode(proof))
          print(f"Verified public commit archive source SHA-256: {proof['source_sha256']}")
          PY
      # One immutable source artifact supplies every native packager after the freeze regressions pass.
      # 冻结回归通过后，由一份不可变源码产物供全部原生打包器使用。
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-core-source-${{ inputs.source_sha }}
          path: target/frozen-source/${{ steps.identity.outputs.source_archive }}
          if-no-files-found: error
          overwrite: false
      # GITHUB_TOKEN cannot receive workflows-write permission; draft source must match the actual default workflows tree.
      # GITHUB_TOKEN 不能获得工作流写权限；草稿源码必须匹配实际默认工作流树。
      - name: Freeze actual default-branch workflow evidence for draft mode
        if: inputs.mode == 'draft'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python scripts/release/freeze_draft_source.py --source-commit "$SOURCE_SHA" --output target/draft-source-evidence.json
      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'draft'
        with:
          name: draft-source-evidence-${{ inputs.source_sha }}
          path: target/draft-source-evidence.json
          if-no-files-found: error
          overwrite: false

  native-acceptance:
    needs: freeze
    uses: ./.github/workflows/managed-runtime-sessions.yml
    with:
      source_sha: ${{ needs.freeze.outputs.source_sha }}

  build:
    needs: [freeze, native-acceptance]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: macos-x64
            runner: macos-15-intel
          - platform: macos-arm64
            runner: macos-15
          - platform: windows-x64
            runner: windows-latest
    env:
      SOURCE_SHA: ${{ needs.freeze.outputs.source_sha }}
      CORE_VERSION: ${{ needs.freeze.outputs.version }}
      # MSVC setup exports PLATFORM=x64; keep the candidate protocol key in a dedicated variable.
      # MSVC 初始化会导出 PLATFORM=x64；候选协议平台键使用独立变量。
      LUASKILLS_CANDIDATE_PLATFORM: ${{ matrix.platform }}
      # The freeze job owns both the filename and compressed bytes; runners never regenerate this input.
      # 冻结作业拥有文件名及压缩字节；运行器不重新生成此输入。
      LUASKILLS_FROZEN_SOURCE_ARCHIVE: target/frozen-source/${{ needs.freeze.outputs.source_archive }}
      RELEASE_PACKAGE_DIR: target/release-packages
    steps:
      - name: Preserve exact tracked source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.freeze.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.6"
      - uses: actions/download-artifact@v4
        with:
          name: frozen-core-source-${{ needs.freeze.outputs.source_sha }}
          path: target/frozen-source
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build exact locked release and capture authoritative Cargo messages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path target -Force | Out-Null
          cargo --version --verbose > target/candidate-cargo-version.txt
          if ($LASTEXITCODE -ne 0) { throw "Actual release Cargo identity capture failed" }
          cargo build --locked --release --lib --bins -j 4 --message-format=json > target/candidate-build.jsonl
          if ($LASTEXITCODE -ne 0) { throw "Locked release build failed" }
          cargo metadata --locked --format-version=1 > target/candidate-metadata.json
          if ($LASTEXITCODE -ne 0) { throw "Locked dependency metadata failed" }
      - name: Package FFI core and complete existing archive set on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build/package_ffi_sdk.ps1 -Platform $env:LUASKILLS_CANDIDATE_PLATFORM -OutputDir $env:RELEASE_PACKAGE_DIR -SourceCommit $env:SOURCE_SHA -SourceArchive $env:LUASKILLS_FROZEN_SOURCE_ARCHIVE -Version $env:CORE_VERSION -BuildLog target/candidate-build.jsonl -Metadata target/candidate-metadata.json -CargoVersion target/candidate-cargo-version.txt
          ./scripts/build/package_demo.ps1 -Mode ffi -Platform $env:LUASKILLS_CANDIDATE_PLATFORM -OutputDir $env:RELEASE_PACKAGE_DIR -ReleaseTag "v$env:CORE_VERSION" -SourceCommit $env:SOURCE_SHA
          ./scripts/build/package_demo.ps1 -Mode rust -Platform $env:LUASKILLS_CANDIDATE_PLATFORM -OutputDir $env:RELEASE_PACKAGE_DIR -ReleaseTag "v$env:CORE_VERSION" -SourceCommit $env:SOURCE_SHA
          ./scripts/build/package_debug_tool.ps1 -Platform $env:LUASKILLS_CANDIDATE_PLATFORM -OutputDir $env:RELEASE_PACKAGE_DIR -ReleaseTag "v$env:CORE_VERSION"
      - name: Package FFI core and complete existing archive set on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build/package_ffi_sdk.sh --platform "$LUASKILLS_CANDIDATE_PLATFORM" --output "$RELEASE_PACKAGE_DIR" --source-commit "$SOURCE_SHA" --source-archive "$LUASKILLS_FROZEN_SOURCE_ARCHIVE" --version "$CORE_VERSION" --build-log target/candidate-build.jsonl --metadata target/candidate-metadata.json --cargo-version target/candidate-cargo-version.txt
          bash scripts/build/package_demo.sh ffi "$LUASKILLS_CANDIDATE_PLATFORM" "v$CORE_VERSION" "$RELEASE_PACKAGE_DIR" "$SOURCE_SHA"
          bash scripts/build/package_demo.sh rust "$LUASKILLS_CANDIDATE_PLATFORM" "v$CORE_VERSION" "$RELEASE_PACKAGE_DIR" "$SOURCE_SHA"
          bash scripts/build/package_debug_tool.sh "$LUASKILLS_CANDIDATE_PLATFORM" "v$CORE_VERSION" "$RELEASE_PACKAGE_DIR"
      - name: Verify complete platform archives and write immutable checksums
        shell: pwsh
        run: |
          python scripts/release/candidate.py collect --platform $env:LUASKILLS_CANDIDATE_PLATFORM --output $env:RELEASE_PACKAGE_DIR --source-commit $env:SOURCE_SHA --version $env:CORE_VERSION
          if ($LASTEXITCODE -ne 0) { throw "Platform candidate verification failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: core-candidate-${{ matrix.platform }}-${{ needs.freeze.outputs.source_sha }}
          path: target/release-packages/
          if-no-files-found: error
          overwrite: false

  aggregate:
    needs: [freeze, native-acceptance, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Preserve exact tracked source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.freeze.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.6"
      - uses: actions/download-artifact@v4
        with:
          pattern: core-candidate-*-${{ needs.freeze.outputs.source_sha }}
          path: target/platform-candidates
          merge-multiple: false
      - name: Verify all five platforms against one frozen source identity
        env:
          SOURCE_SHA: ${{ needs.freeze.outputs.source_sha }}
          CORE_VERSION: ${{ needs.freeze.outputs.version }}
        run: |
          python scripts/release/candidate.py aggregate --input target/platform-candidates --output target/verified-candidate --source-commit "$SOURCE_SHA" --version "$CORE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-core-candidate-${{ needs.freeze.outputs.source_sha }}
          path: target/verified-candidate/
          if-no-files-found: error
          overwrite: false

  draft:
    if: inputs.mode == 'draft'
    needs: [freeze, aggregate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.freeze.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.6"
      - uses: actions/download-artifact@v4
        with:
          name: verified-core-candidate-${{ needs.freeze.outputs.source_sha }}
          path: target/verified-candidate
      - uses: actions/download-artifact@v4
        with:
          name: draft-source-evidence-${{ needs.freeze.outputs.source_sha }}
          path: target/draft-source-evidence
      # This independent stage creates only a new draft; it never updates or replaces a release asset.
      # 此独立阶段仅创建新草稿；绝不更新或替换发布资产。
      - name: Create new immutable draft after aggregate acceptance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.freeze.outputs.source_sha }}
          CORE_VERSION: ${{ needs.freeze.outputs.version }}
        run: |
          python scripts/release/create_draft.py --candidate target/verified-candidate --source-commit "$SOURCE_SHA" --version "$CORE_VERSION" --source-evidence target/draft-source-evidence/draft-source-evidence.json
